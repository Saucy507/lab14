<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio 14 · Recorrido inmersivo interactivo</title>
  <!-- A-Frame 1.8.0 guardado en local (assets/) para que funcione sin internet -->
  <script src="assets/aframe-v1.8.0.min.js"></script>
  <script>
    /* ---------- Componente: texto-canvas ----------
       Dibuja título y texto en un <canvas> de HTML5 y lo usa como textura
       de un plano. Admite tildes y la ñ porque usa las fuentes del sistema. */
    AFRAME.registerComponent('texto-canvas', {
      schema: {
        titulo: { default: '' },
        texto: { default: '' },
        ancho: { default: 2 },        // ancho del plano (metros)
        alto: { default: 1.2 },       // alto del plano (metros)
        pixeles: { default: 1024 },   // ancho del canvas en píxeles
        fondo: { default: 'rgba(40,24,14,0.88)' },
        colorTitulo: { default: '#F2C38B' },
        colorTexto: { default: '#FFFFFF' },
        tamTitulo: { default: 70 },
        tamTexto: { default: 44 },
        centrado: { default: false }
      },
      init: function () {
        this.canvas = document.createElement('canvas');
        this.textura = new THREE.CanvasTexture(this.canvas);
        this.textura.colorSpace = THREE.SRGBColorSpace;
        this.material = new THREE.MeshBasicMaterial({
          map: this.textura, transparent: true, side: THREE.DoubleSide
        });
        this.malla = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.material);
        this.el.setObject3D('mesh', this.malla);
      },
      update: function () {
        const d = this.data;
        const escala = d.pixeles / d.ancho;
        this.canvas.width = d.pixeles;
        this.canvas.height = Math.round(d.alto * escala);
        this.malla.geometry.dispose();
        this.malla.geometry = new THREE.PlaneGeometry(d.ancho, d.alto);

        const ctx = this.canvas.getContext('2d');
        const W = this.canvas.width, H = this.canvas.height, m = 40;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = d.fondo;
        ctx.beginPath();
        ctx.roundRect(0, 0, W, H, 36);
        ctx.fill();

        const fuente = 'system-ui, "Segoe UI", Arial, sans-serif';
        ctx.textBaseline = 'top';
        ctx.textAlign = d.centrado ? 'center' : 'left';
        const x = d.centrado ? W / 2 : m;
        let y = d.centrado ? (H - d.tamTitulo) / 2 : m;

        ctx.fillStyle = d.colorTitulo;
        ctx.font = 'bold ' + d.tamTitulo + 'px ' + fuente;
        ctx.fillText(d.titulo, x, y);
        y += d.tamTitulo + 24;

        ctx.fillStyle = d.colorTexto;
        ctx.font = d.tamTexto + 'px ' + fuente;
        let linea = '';
        d.texto.split(' ').forEach(palabra => {
          const prueba = linea ? linea + ' ' + palabra : palabra;
          if (ctx.measureText(prueba).width > W - 2 * m && linea) {
            ctx.fillText(linea, x, y);
            y += d.tamTexto * 1.35;
            linea = palabra;
          } else {
            linea = prueba;
          }
        });
        if (linea) ctx.fillText(linea, x, y);
        this.textura.needsUpdate = true;
      }
    });

    /* ---------- Componente: mirar-al-centro ----------
       Orienta la entidad hacia el visitante (que está en 0, 1.6, 0). */
    AFRAME.registerComponent('mirar-al-centro', {
      init: function () {
        this.orientar = this.orientar.bind(this);
        this.el.addEventListener('loaded', this.orientar);
        this.orientar();
      },
      orientar: function () {
        this.el.object3D.lookAt(new THREE.Vector3(0, 1.6, 0));
      }
    });

    /* ---------- Componente: recorrido ----------
       Carga puntos.json con fetch() y crea un punto de interés por cada dato. */
    AFRAME.registerComponent('recorrido', {
      schema: { datos: { type: 'string', default: 'puntos.json' } },

      init: function () {
        const escena = this.el.sceneEl;
        this.hud = escena.querySelector('#hud');
        this.panel = escena.querySelector('#panel');
        this.cerrar = escena.querySelector('#cerrar');
        this.total = 0;
        this.visitados = new Set();

        // El botón X cierra el panel
        this.cerrar.addEventListener('click', () => this.ocultarPanel());

        // B1 · Cargar los datos con fetch()
        fetch(this.data.datos)
          .then(respuesta => {
            if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
            return respuesta.json();
          })
          .then(puntos => {
            this.total = puntos.length;
            puntos.forEach(p => this.crearPunto(p));
            this.actualizarHud();
          })
          .catch(error => this.hud.setAttribute('texto-canvas',
            { titulo: 'Error', texto: error.message }));
      },

      // B2 · Crear cada punto desde JavaScript
      crearPunto: function (p) {
        const punto = document.createElement('a-entity');
        punto.setAttribute('id', 'punto-' + p.id);
        punto.setAttribute('class', 'clicable');
        punto.setAttribute('position', p.posicion);          // {x, y, z} del JSON
        punto.setAttribute('geometry', { primitive: 'circle', radius: 0.32 });
        punto.setAttribute('material', { color: '#B4441C', shader: 'flat' });
        punto.setAttribute('mirar-al-centro', '');
        punto.setAttribute('animation__latido', {
          property: 'scale', from: '1 1 1', to: '1.18 1.18 1.18',
          dir: 'alternate', loop: true, dur: 700, easing: 'easeInOutSine'
        });
        punto.addEventListener('click', () => this.mostrarPanel(p, punto));
        this.el.appendChild(punto);
      },

      // C1 y C2 · Mostrar la información y marcar como visitado
      mostrarPanel: function (p, punto) {
        const pos = p.posicion;
        this.panel.object3D.position.set(pos.x * 0.4, 1.6 + (pos.y - 1.6) * 0.4, pos.z * 0.4);
        this.panel.object3D.lookAt(new THREE.Vector3(0, 1.6, 0));
        this.panel.setAttribute('texto-canvas', { titulo: p.titulo, texto: p.descripcion });
        this.panel.setAttribute('visible', true);
        this.cerrar.classList.add('clicable');

        // visitado: se pinta de verde y se actualiza el HUD
        this.visitados.add(p.id);
        punto.setAttribute('material', 'color', '#1E7A4C');
        this.actualizarHud();
      },

      ocultarPanel: function () {
        this.panel.setAttribute('visible', false);
        this.cerrar.classList.remove('clicable');
      },

      actualizarHud: function () {
        const n = this.visitados.size;
        const completo = this.total > 0 && n === this.total;
        this.hud.setAttribute('texto-canvas', {
          titulo: completo ? '¡Recorrido completo!' : 'Recorrido',
          texto: 'Puntos visitados: ' + n + ' de ' + this.total,
          colorTitulo: completo ? '#7CE0A8' : '#F2C38B'
        });
      }
    });
  </script>
</head>
<body>
  <a-scene renderer="colorManagement: true" vr-mode-ui="enabled: true">
    <a-assets timeout="10000">
      <img id="panorama" src="assets/panorama.jpg">
      <a-asset-item id="taza" src="assets/taza.glb"></a-asset-item>
    </a-assets>

    <!-- A1 · El cielo con la foto 360° (el centro de la foto queda al frente) -->
    <a-sky src="#panorama" rotation="0 -90 0"></a-sky>

    <!-- Cámara a la altura de los ojos, con HUD y cursor de mirada -->
    <a-entity camera look-controls wasd-controls-enabled="false" position="0 1.6 0">
      <!-- Indicador de avance (HUD) -->
      <a-entity id="hud" position="0 -0.62 -1.2"
        texto-canvas="titulo: Recorrido; texto: Cargando...; ancho: 0.95; alto: 0.34; pixeles: 760; tamTitulo: 52; tamTexto: 40; centrado: false"></a-entity>

      <!-- A2 · Cursor de mirada (fuse) -->
      <a-entity cursor="fuse: true; fuseTimeout: 1500" raycaster="objects: .clicable; far: 20"
        position="0 0 -1" geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
        material="color: #FFFFFF; shader: flat"
        animation__llenando="property: scale; startEvents: fusing; from: 1 1 1; to: 0.4 0.4 0.4; dur: 1500"
        animation__suelta="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 150">
      </a-entity>
    </a-entity>

    <!-- Panel de información (oculto hasta que se mira un punto) -->
    <a-entity id="panel" visible="false" position="0 1.6 -2"
      texto-canvas="titulo: ; texto: ; ancho: 2; alto: 1.1">
      <a-entity id="cerrar" position="0.86 0.42 0.02"
        texto-canvas="titulo: X; ancho: 0.2; alto: 0.2; pixeles: 128; tamTitulo: 80; fondo: #B4441C; colorTitulo: #FFFFFF; centrado: true"></a-entity>
    </a-entity>

    <!-- Los puntos de interés los crea JavaScript a partir de puntos.json -->
    <a-entity id="mundo" recorrido="datos: puntos.json"></a-entity>

    <!-- C3 · Modelo 3D interactivo sobre un pedestal -->
    <a-entity position="1.9 0 -1.1">
      <a-cylinder radius="0.35" height="0.9" position="0 0.45 0" color="#F2E8D5"></a-cylinder>
      <a-entity id="modelo" class="clicable" gltf-model="#taza" position="0 0.95 0" scale="0.3 0.3 0.3"
        animation__gira="property: rotation; from: 0 0 0; to: 0 360 0; dur: 1500; startEvents: click"
        animation__entra="property: scale; to: 0.36 0.36 0.36; dur: 200; startEvents: mouseenter"
        animation__sale="property: scale; to: 0.3 0.3 0.3; dur: 200; startEvents: mouseleave">
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
